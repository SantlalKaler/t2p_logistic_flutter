org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
android.enableJetifier=false
# AGP 9 native Kotlin support (Flutter 3.47+)
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Pub cache and project can be on different Windows drives.
# Kotlin incremental caches cannot relativize paths across drive roots.
kotlin.incremental=false

# Bound concurrent Android transforms on developer machines.
org.gradle.workers.max=2
